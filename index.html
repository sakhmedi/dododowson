<!DOCTYPE html>
<html lang="ru" data-covers="color">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dododowson</title>
  <meta name="description" content="dododowson — releases, videos and concerts." />
  <meta name="theme-color" content="#000000" />

  <!-- Social share cards (Telegram / Instagram / WhatsApp / X) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="dododowson" />
  <meta property="og:description" content="Releases, videos and concerts." />
  <!-- Drop a 1200x630 image at img/og.jpg for the share card to appear. -->
  <meta property="og:image" content="img/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23000'/><text x='32' y='46' font-size='40' font-weight='900' text-anchor='middle' fill='%23f2f2f0' font-family='Arial,sans-serif'>D</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="flash" id="flash" aria-hidden="true" hidden></div>

  <header class="head">
    <a class="brand" href="#top">dododowson</a>
    <div class="head-right">
      <nav class="nav" aria-label="Sections">
        <a class="nav-link" href="#releases">Releases</a>
        <a class="nav-link" href="#videos">Videos</a>
        <a class="nav-link" href="#concerts">Concerts</a>
      </nav>
      <div class="lang" id="lang">
        <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu">
          <span id="lang-cur">RU</span><span class="tri-down" aria-hidden="true"></span>
        </button>
        <div class="lang-menu" id="lang-menu" role="menu" hidden></div>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="top">
      <div class="hero-photo">
        <canvas class="dither" id="dither" role="img" aria-label="dododowson"></canvas>
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="hero-shade-2" aria-hidden="true"></div>

      <div class="hero-body">
        <h1 class="wordmark">dodo<br />dowson</h1>
        <div class="hero-meta">
          <p class="tagline" id="tagline"></p>
          <div class="latest" id="latest"></div>
        </div>
      </div>
    </section>

    <!-- RELEASES -->
    <section class="sec sec-releases" id="releases">
      <h2 class="sec-title">Releases</h2>
      <div class="years" id="years"></div>
    </section>

    <!-- VIDEOS -->
    <section class="sec sec-videos" id="videos">
      <h2 class="sec-title">Videos</h2>
      <div class="videos" id="videos-grid"></div>
    </section>

    <!-- CONCERTS -->
    <section class="sec sec-concerts" id="concerts">
      <h2 class="sec-title">Concerts</h2>
      <div class="shows-box" id="concerts-body"></div>
    </section>
  </main>

  <footer class="foot">
    <span class="foot-ghost" aria-hidden="true">dododowson</span>
    <div class="foot-row">
      <span>© <span id="year"></span> dododowson</span>
      <div class="foot-links" id="foot-links"></div>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="dither.js"></script>
  <script src="app.js"></script>
</body>
</html>
